<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Katsu</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="stage">
      <article class="saying" id="saying" aria-live="polite">
        <p class="verse" id="verse"></p>
        <p class="source" id="source"></p>
      </article>
    </main>
    <footer class="katsu-bar">
      <div class="katsu-switch">
        <button type="button" class="katsu-lang" id="katsu-lang" aria-haspopup="dialog" aria-expanded="false" aria-controls="lang-dialog" aria-label="Switch language">
          <span class="katsu-word" id="katsu-word">Katsu</span>
        </button>
        <span class="katsu-sep" aria-hidden="true">·</span>
        <button type="button" class="katsu-corpus-btn" id="katsu-switch" aria-label="Switch corpus">
          <span class="katsu-corpus" id="katsu-corpus">Sutras</span>
        </button>
      </div>
    </footer>
    <dialog class="lang-dialog" id="lang-dialog">
      <p class="lang-dialog-title" id="lang-dialog-title"></p>
      <div class="lang-dialog-list" id="lang-dialog-list"></div>
    </dialog>
    <script src="i18n.js"></script>
    <script src="sayings.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
